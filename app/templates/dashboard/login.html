{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 公司管理后台</title>
<link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="brand-row">
      <span class="brand-mark"></span>
      <h1>白云企业管理</h1>
    </div>
    <p class="subtitle">公司管理后台</p>

    {% if messages %}
    <ul class="messages">
      {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
    </ul>
    {% endif %}

    {% if form.non_field_errors %}
    <div class="messages"><div class="error">{{ form.non_field_errors }}</div></div>
    {% endif %}

    <form method="post" action="{% url 'dashboard:login' %}">
      {% csrf_token %}
      <label class="field-label" for="{{ form.phone.id_for_label }}">手机号</label>
      <div class="phone-row">
        {{ form.phone }}
      </div>
      <label class="field-label" for="{{ form.password.id_for_label }}">密码</label>
      {{ form.password }}
      <button type="submit" class="btn-login">登 录</button>
    </form>
  </div>
</body>
</html>
