<div class="oss-upload" id="oss-{{ widget.name }}-box"
     data-url="{% url 'api:oss-upload-url' %}"
     data-dir="{{ widget.upload_dir }}"
     data-accept="{{ widget.accept }}"
     data-inited="">
  <input type="hidden" name="{{ widget.name }}" value="{{ widget.value|default:'' }}" id="oss-{{ widget.name }}">
  <div class="oss-preview" id="oss-{{ widget.name }}-preview">
    {% if widget.value %}
      {% if widget.is_video %}<video src="{{ widget.value }}" controls style="max-width:200px"></video>
      {% else %}<img src="{{ widget.value }}" alt="" style="max-width:160px;border-radius:6px">{% endif %}
    {% endif %}
  </div>
  <div class="oss-actions">
    <label class="btn sm" style="cursor:pointer">上传
      <input type="file" id="oss-{{ widget.name }}-file" accept="{{ widget.accept }}" style="display:none">
    </label>
  </div>
  <div class="oss-status" id="oss-{{ widget.name }}-status" style="font-size:13px;margin-top:6px"></div>
</div>
<script>
(function () {
  var box = document.getElementById('oss-{{ widget.name }}-box')
  if (!box || box.dataset.inited === '1') return
  box.dataset.inited = '1'
  var hidden = document.getElementById('oss-{{ widget.name }}')
  var preview = document.getElementById('oss-{{ widget.name }}-preview')
  var fileInput = document.getElementById('oss-{{ widget.name }}-file')
  var status = document.getElementById('oss-{{ widget.name }}-status')
  var isVideo = box.dataset.accept.indexOf('video') === 0

  function csrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/)
    return m ? m[1] : ''
  }
  function showStatus(msg, ok) {
    status.textContent = msg
    status.style.color = ok ? '#10b981' : '#ef4444'
  }
  // ---- 图片压缩（浏览器端 canvas）----
  var IMG_MAX_EDGE = 1600  // 长边像素上限，超过才缩放
  var IMG_QUALITY = 0.82   // JPEG 质量

  // 压缩成功后返回 { blob, filename }；无法压缩/无收益时返回 null（调用方回退直传原文件）
  function compressImage(file) {
    if (typeof createImageBitmap === 'undefined') return Promise.resolve(null)
    return createImageBitmap(file)
      .then(function (bmp) {
        var w = bmp.width, h = bmp.height
        var scale = Math.min(1, IMG_MAX_EDGE / Math.max(w, h))
        // 原图已经够小且是 jpeg：不再二次压缩，避免画质损耗
        if (scale >= 1 && file.type === 'image/jpeg') {
          if (bmp.close) bmp.close()
          return null
        }
        var canvas = document.createElement('canvas')
        canvas.width = Math.max(1, Math.round(w * scale))
        canvas.height = Math.max(1, Math.round(h * scale))
        canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height)
        var outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg'
        var outName = file.name.replace(/\.[^.]+$/, '') +
          (outType === 'image/png' ? '.png' : '.jpg')
        return new Promise(function (resolve) {
          canvas.toBlob(function (blob) {
            if (bmp.close) bmp.close()
            if (!blob || blob.size >= file.size) resolve(null) // 无收益，保留原文件
            else resolve({ blob: blob, filename: outName })
          }, outType, outType === 'image/jpeg' ? IMG_QUALITY : undefined)
        })
      })
      .catch(function () { return null })
  }

  async function upload(file) {
    showStatus('处理中…')
    var payload = {
      dir: box.dataset.dir,
      filename: file.name,
      kind: isVideo ? 'video' : 'image',
    }
    var toUpload = file
    try {
      if (!isVideo) {
        var r = await compressImage(file)
        if (r) { toUpload = r.blob; payload.filename = r.filename }
      }
    } catch (e) { /* 压缩失败则按原文件直传 */ }
    payload.size = toUpload.size || 0
    try {
      var resp = await fetch(box.dataset.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify(payload),
      })
      var data = await resp.json()
      if (!resp.ok) { showStatus(data.detail || '获取上传地址失败'); return }
      // 用空类型 Blob 包裹，使 fetch 不带 Content-Type 头（否则与签名不符会 403）
      var up = await fetch(data.upload_url, { method: 'PUT', body: new Blob([toUpload]) })
      if (!up.ok) { showStatus('上传到 OSS 失败（' + up.status + '）'); return }
      hidden.value = data.file_url
      preview.innerHTML = isVideo
        ? '<video src="' + data.file_url + '" controls style="max-width:200px"></video>'
        : '<img src="' + data.file_url + '" alt="" style="max-width:160px;border-radius:6px">'
      showStatus('上传成功', true)
    } catch (e) {
      showStatus('上传失败：' + (e.message || '网络异常'))
    }
  }
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) upload(fileInput.files[0])
  })
})();
</script>
